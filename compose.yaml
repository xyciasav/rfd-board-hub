services:
  rfd-board-hub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${RFD_HUB_VERSION:-0.2.0}
    image: rfd-board-hub:${RFD_HUB_VERSION:-0.2.0}
    container_name: rfd-board-hub
    restart: unless-stopped
    ports:
      - "${RFD_HUB_PORT:-4380}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      APP_VERSION: ${RFD_HUB_VERSION:-0.2.0}
      BOARD_PASSWORD: ${BOARD_PASSWORD:?Set a temporary BOARD_PASSWORD in Portainer}
      ALLOW_BOARD_PASSWORD_LOGIN: ${ALLOW_BOARD_PASSWORD_LOGIN:-true}
      AUTH_BYPASS: ${AUTH_BYPASS:-false}
    volumes:
      - rfd-board-hub-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rfd-board-hub-data:
